<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naber Kanki 💗</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  body{
    background:radial-gradient(circle at center,#ffb6dc 0%,#ff72b7 45%,#d91b78 100%);
    font-family:Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    color:white;
  }
  .glow{
    position:absolute;width:80vmin;height:80vmin;border-radius:50%;
    background:rgba(255,255,255,.12);filter:blur(25px);
  }
  .card{
    position:relative;z-index:5;text-align:center;
    padding:42px 32px;border-radius:30px;
    background:rgba(255,255,255,.16);
    border:2px solid rgba(255,255,255,.4);
    box-shadow:0 15px 60px rgba(120,0,70,.25);
    backdrop-filter:blur(8px);
    animation:pop .9s ease-out;
  }
  h1{margin:0 0 14px;font-size:clamp(42px,10vw,82px);text-shadow:0 5px 18px #b0005c}
  p{margin:0;font-size:clamp(20px,4vw,32px);font-weight:bold}
  .sub{margin-top:12px;font-size:clamp(16px,3vw,23px);font-weight:normal}
  .heart{position:absolute;bottom:-50px;animation:float linear forwards;pointer-events:none}
  canvas{position:fixed;inset:0;z-index:2;pointer-events:none}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes float{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="glow"></div>
<canvas id="fw"></canvas>

<div class="card">
  <h1>Naber kankiii? 💗</h1>
  <p>Seni çok seviyorum kardeşim! 🫶💖</p>
  <div class="sub">İyi ki varsın! ✨</div>
</div>

<script>
const hearts=["💗","💖","💕","💞","💓","💘","🩷"];
function heart(){
  const el=document.createElement("div");
  el.className="heart";
  el.textContent=hearts[Math.floor(Math.random()*hearts.length)];
  el.style.left=Math.random()*100+"vw";
  el.style.fontSize=(18+Math.random()*30)+"px";
  el.style.animationDuration=(4+Math.random()*5)+"s";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),9000);
}
setInterval(heart,260);

const c=document.getElementById("fw"),ctx=c.getContext("2d");
let W,H,particles=[];
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
addEventListener("resize",resize);resize();

function boom(x,y){
  const hue=Math.random()*360;
  for(let i=0;i<75;i++){
    const a=Math.random()*Math.PI*2, s=1.5+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:70+Math.random()*35,hue});
  }
}
function fireworks(){
  boom(W*(.15+Math.random()*.7),H*(.12+Math.random()*.45));
}
setInterval(fireworks,900);
fireworks(); setTimeout(fireworks,450);

function draw(){
  ctx.clearRect(0,0,W,H);
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.99;p.vy*=.99;p.life--;
    ctx.globalAlpha=Math.max(0,p.life/100);
    ctx.fillStyle=`hsl(${p.hue},100%,70%)`;
    ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
